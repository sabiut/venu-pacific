name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (shell, systemd units, XML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure systemd-analyze, msgfmt and dpkg-dev are available
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends systemd gettext dpkg-dev

      - name: Run lint checks
        run: ./scripts/lint.sh

  build-iso:
    name: Build ISO
    needs: lint
    runs-on: ubuntu-latest
    # Runs inside a real Debian trixie container, not directly on the
    # ubuntu-latest host — Ubuntu's own live-build package doesn't
    # correctly template modern Debian suite naming (security.debian.org
    # trixie-security) when cross-building a trixie target; it falls back
    # to an old pre-2019 "trixie/updates" path that 404s. --privileged is
    # needed for the chroot/mount/mknod operations live-build performs.
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install live-build and the Debian packaging toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build ca-certificates file \
            build-essential debhelper gettext apt-file

      # Everything Venu Pacific-specific reaches the image as a real .deb,
      # not as loose files copied in. That is what lets an installed machine
      # upgrade through `apt` later: dpkg owns the files, and the archive
      # keyring built here points apt at venupacific.org's own repository.
      - name: Build the Venu Pacific packages
        run: ./scripts/build-debs.sh

      # Runs BEFORE lb build on purpose. A path owned by two packages makes
      # dpkg refuse the unpack, which used to surface twenty minutes into
      # `lb build` with the error buried in the unpack log. This answers the
      # same question in about a minute.
      - name: Check for file-ownership conflicts with Debian packages
        run: |
          apt-file update
          ./scripts/check-file-conflicts.sh

      # live-build turns config/config/packages.chroot into a local apt
      # repository, so venu-pacific-desktop (named in the package list)
      # installs with full dependency resolution.
      - name: Stage the packages for live-build
        run: cp dist/*.deb config/config/packages.chroot/

      - name: lb config
        working-directory: config
        run: |
          lb config \
            --distribution trixie \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer none \
            --iso-volume "Venu Pacific"

      - name: lb build
        working-directory: config
        run: lb build

      - name: Verify the ISO was produced
        working-directory: config
        run: |
          test -f live-image-amd64.hybrid.iso
          file live-image-amd64.hybrid.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: venu-pacific-iso
          path: config/live-image-amd64.hybrid.iso
          retention-days: 7

      # Kept separately from the ISO: these are what a release publishes to
      # the apt archive, and they are small enough to keep around far longer
      # than a 4.7GB image.
      - name: Upload the .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venu-pacific-debs
          path: dist/*.deb
          retention-days: 30
