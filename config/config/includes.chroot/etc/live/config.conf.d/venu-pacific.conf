# Identity of the live session's auto-created user and machine.
#
# live-config sets its own defaults in /usr/lib/live/init-config.sh and then
# sources this directory, so anything set here wins:
#
#     LIVE_HOSTNAME="debian"
#     LIVE_USERNAME="user"
#     LIVE_USER_FULLNAME="Debian Live user"
#
# Those are what the live session showed before this file existed -- the XFCE
# panel named the user "Debian Live user" in the top-right corner, and every
# terminal prompt read user@debian. On an ISO handed to someone as Venu
# Pacific, that is the most visible piece of Debian branding there is.
#
# This is a live-session-only setting, which is why it ships through
# includes.chroot rather than a package: live-config does not run on an
# installed system, where Calamares asks for a real name and hostname
# instead.
#
# Not touching LIVE_USER_DEFAULT_GROUPS -- overriding it means restating the
# whole list, and dropping a group by accident would cost the live user
# audio, video or network access.

LIVE_HOSTNAME="venu-pacific"
LIVE_USERNAME="venu"
LIVE_USER_FULLNAME="Venu Pacific Live User"
