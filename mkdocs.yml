# Documentation site config -- built and deployed to GitHub Pages by
# .github/workflows/docs.yml on every push to main that touches docs/.
# The site serves the DOCS; the ISO itself is served from Cloudflare R2
# (see docs/releasing.md) -- Pages has no business hosting a 4.7GB binary.
site_name: Venu Pacific
site_description: >-
  A Debian-based desktop Linux distribution built for the Pacific Islands
  region -- offline-first, low-spec-friendly, in English, Bislama and Fijian.
site_url: https://venupacific.org/
repo_url: https://github.com/sabiut/venu-pacific
repo_name: sabiut/venu-pacific
edit_uri: edit/main/docs/

theme:
  name: material
  # The volcano mark -- same circle badge deployed as the OS's app icon,
  # login avatar, installer and boot-splash logo (branding/logo/), so the
  # website and the OS read as one thing.
  logo: assets/venu-mark.png
  favicon: assets/venu-mark.png
  palette:
    # Dark first -- matches the OS's own design language.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

# Working documents stay in the repo but off the published site: the
# historical Calamares test record, the content-sourcing research notes
# (carefully caveated, but research working notes all the same), and the
# directory README (redundant with this nav). The repo is public either
# way -- this is curation, not secrecy.
exclude_docs: |
  README.md
  manual-test-checklist.md
  content-sourcing.md

nav:
  - Home: index.md
  - For users & schools:
      - Download & verify: download.md
      - Install guide: install-guide.md
  - For contributors:
      - Release process: releasing.md
      - Release test checklist: release-test-checklist.md
