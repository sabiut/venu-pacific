// Archive-level fields for the dists/<suite>/Release file, read by
// apt-ftparchive in scripts/apt-repo/publish.sh.
//
// Codename tracks the Debian base rather than the Venu Pacific version. A
// machine installed from 26.08 and one installed from 26.11 are both trixie
// machines and want the same packages; the suite only changes when the
// Debian base does, which is also when a machine genuinely should stop
// receiving these packages until it is reinstalled.
//
// Note what is deliberately absent: Valid-Until. apt refuses a Release file
// older than that date, and the machines this distro serves may go months
// between connections. An expiry here would turn "this laptop was offline
// for a while" into "apt update fails and the user cannot fix it" -- the
// same reasoning that keeps the signing key non-expiring.

APT::FTPArchive::Release::Origin "Venu Pacific";
APT::FTPArchive::Release::Label "Venu Pacific";
APT::FTPArchive::Release::Suite "trixie";
APT::FTPArchive::Release::Codename "trixie";
APT::FTPArchive::Release::Version "13";
APT::FTPArchive::Release::Architectures "amd64";
APT::FTPArchive::Release::Components "main";
APT::FTPArchive::Release::Description "Venu Pacific packages for Debian 13 (trixie)";
